[package]
name = "macos-smc-exporter"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0", features = ["blocking", "json"] }
plist = "1"
tiny_http = "0"

[target.'cfg(target_os = "macos")'.dependencies]
smc = "0.2"
